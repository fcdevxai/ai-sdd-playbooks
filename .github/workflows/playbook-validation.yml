name: Validación SDD

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  playbook-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Valida artefactos, config, lock, estado legal del lifecycle, gates, adapters.
      # Solo checks estructurados — sin matchear verdicts/encabezados/emojis, sin mutar.
      - name: playbook validate --ci
        run: npx --yes playbook-ai validate --ci
