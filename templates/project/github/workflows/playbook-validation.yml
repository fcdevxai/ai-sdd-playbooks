name: Validación SDD

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  playbook-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `playbook-ai` no está publicado en el registro público de npm; ese nombre
      # pertenece a un proyecto de terceros no relacionado, así que `npx` traería
      # el paquete equivocado en silencio. Se instala desde el repo público real.
      - name: Instalar playbook CLI
        run: npm install -g github:fcdevxai/ai-sdd-playbooks#semver:^0.9.0
      # Valida artefactos, config, lock, estado legal del lifecycle, gates, adapters.
      # Solo checks estructurados — sin matchear verdicts/encabezados/emojis, sin mutar.
      - name: playbook validate --ci
        run: playbook validate --ci
