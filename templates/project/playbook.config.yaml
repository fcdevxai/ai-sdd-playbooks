version: 2
project:
  name: mi-proyecto
  language: es          # idioma del contenido humano (cuerpos de los documentos)
methodology:
  scope: user           # instalación global
  compatible: ">=0.1.0 <1.0.0"
capabilities:           # marca las que tu proyecto realmente tiene (activa sdd-runtime-gate)
  browser: false        # tiene una UI web; requiere Playwright MCP en el runtime activo
  http: false           # tiene una superficie HTTP/REST
  cli: false             # tiene una superficie de línea de comandos (adapter experimental)
  worker: false          # tiene workers/colas en background (adapter experimental)
design:
  always: false         # fuerza sdd-design sin importar el impact declarado
security:
  default_risk: standard   # low | standard | elevated
  threat_model: auto       # auto | always | never
github:
  base_branch: main        # nunca hardcodeado en el código; se lee de acá o de GitHub
  require_pull_request: true
  require_ci: true
documents:                 # adopta documentos existentes apuntando estas rutas a los reales
  system_spec: openspec/specs/system.md
  agent_architecture: docs/agent_architecture.md
  architecture: docs/doc_architecture.md
  verification: docs/doc_verification_guide.md
  workflow: docs/sdd-workflow.md
addons:
  confluence: false        # requiere Atlassian MCP en el runtime activo

# Opcional — solo si un backend de este hub expone una API que uno o más
# frontends consumen. Loom-first: el contrato se autora acá (durante sdd-design)
# antes de que el backend lo implemente; `playbook contract-drift` compara
# estructuralmente el contrato canónico contra el OpenAPI generado del backend.
# `provided_by`/`consumed_by` son opcionales y nombran repos declarados en
# `repos:` más abajo — `sdd-plan`/`sdd-apply` los usan para distinguir la
# obligación del provider (cumplir el contrato) de la del consumer (llamarlo).
# Descomentar y ajustar cuando exista un backend real:
# contract:
#   source_of_truth: loom-first
#   path_in_loom: openspec/specs/contracts/openapi.yaml
#   provided_by: backend            # el repo que expone la API
#   consumed_by: [frontend]         # los repos que la consumen
#   drift_check:
#     ci_template: templates/project/github/workflows/contract-drift-check.yml
#     runs_in: "el CI del backend — instalar el template ahí, no en este repo"

# Opcional — solo para proyectos multi-repo. Declara acá cada repo que una
# proposal puede nombrar en su `## Impacted repos`; `playbook status`/`next`
# agregan el delivery de todos ellos (regla "eslabón más débil": `merged` solo
# si TODOS lo están — ver ADR multi-repo-delivery-reduction). Un nombre listado
# en `## Impacted repos` pero ausente de acá cuenta como `unknown` (fail-closed).
# "Impactado" no es un rol de config: se lee del `## Impacted repos` de la
# proposal de cada change, no de acá — por eso ningún repo de este bloque
# declara `role` salvo el hub SDD (`role: sdd`, opcional y único).
# Descomentar y ajustar cuando el proyecto tenga repos hermanos reales:
# repos:
#   loom:                          # el hub SDD (este repo); role: sdd es opcional
#     path: .
#     role: sdd
#   backend:
#     path: ../mi-proyecto-backend
#     verification:
#       tests: npm test
#   frontend:
#     path: ../mi-proyecto-frontend
#     verification:
#       tests: npm test
# gating:
#   strategy: per-feature           # el merge de una feature exige TODOS sus repos impactados mergeados
